services:
  db:
    image: postgres:16
    container_name: contenedor_bd
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  recolector:
    build: ./recolector
    container_name: contenedor_recolector
    env_file: .env
    environment:
      POSTGRES_HOST: db
      TZ: ${APP_TZ}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
  dashboard:
    build: ./dashboard
    container_name: contenedor_dashboard
    env_file: .env
    environment:
      POSTGRES_HOST: db
      APP_TZ: America/Hermosillo
    ports:
      - "8050:8050"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
